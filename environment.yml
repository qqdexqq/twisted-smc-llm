name: adaptive-tsmc
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - numpy
      - scipy
      - matplotlib
      - pytest
      - pyyaml
      - datasets          # Stage 1: pulling benchmark manifests
      - huggingface_hub
      - pandas
      - pyarrow
      - math-verify[antlr4_13_2]
      # GPU-only extras (torch, transformers, vllm) are NOT here -- this
      # env is for the laptop. Install `pip install -e ".[gpu]"` on the
      # rented GPU box instead (see README's Stage 1 GPU section).
